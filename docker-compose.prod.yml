services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  backend:
    image: anannyeah/turbocompress-backend:latest
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:4000:4000"

  worker:
    image: anannyeah/turbocompress-worker:latest
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env.prod

  frontend:
    image: anannyeah/turbocompress-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  redisdata:
